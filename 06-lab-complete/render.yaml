# Render Blueprint (tiêu chí 12) — thay thế cho railway.toml.
# Render đọc render.yaml ở GỐC repo; file này nằm trong 06-lab-complete/ nên khi tạo
# Blueprint chọn "Blueprint Path" = 06-lab-complete/render.yaml.
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    dockerfilePath: ./06-lab-complete/Dockerfile   # đường dẫn tính từ gốc repo
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh secret, không ghi giá trị ở đây
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue                   # Redis-compatible (Render Key Value)
    name: day14-redis
    plan: free
    ipAllowList: []                  # chỉ cho phép kết nối nội bộ từ các service Render
    maxmemoryPolicy: noeviction
