# Railway (tiêu chí 12) — deploy: cd 06-lab-complete && railway up
# PORT do Railway cấp, Dockerfile đã nghe theo ${PORT:-8000}.
# Biến cần đặt trên dashboard (Variables), KHÔNG ghi ở đây:
#   AGENT_API_KEY (secret), REDIS_URL (= ${{Redis.REDIS_URL}} của service Redis),
#   ENVIRONMENT=production, RATE_LIMIT_PER_MINUTE, DAILY_BUDGET_USD, MONTHLY_BUDGET_USD

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
